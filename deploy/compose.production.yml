services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NOME}
      MYSQL_USER: ${DB_USUARIO}
      MYSQL_PASSWORD: ${DB_SENHA}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      AMBIENTE: ${AMBIENTE}
      PORTA: "8080"
      FUSO_HORARIO: ${FUSO_HORARIO}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USUARIO: ${DB_USUARIO}
      DB_SENHA: ${DB_SENHA}
      DB_NOME: ${DB_NOME}
      DB_CRIAR_BANCO: "false"
      MESTRE_EMAIL: ${MESTRE_EMAIL}
      MESTRE_SENHA: ${MESTRE_SENHA}
      ORIGEM_FRONTEND: ${ORIGEM_FRONTEND}
      RATE_GLOBAL_RPS: ${RATE_GLOBAL_RPS}
      RATE_GLOBAL_BURST: ${RATE_GLOBAL_BURST}
      RATE_LOGIN_RPS: ${RATE_LOGIN_RPS}
      RATE_LOGIN_BURST: ${RATE_LOGIN_BURST}
      UPLOADS_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/saude"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
